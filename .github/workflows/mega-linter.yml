# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
---
name: MegaLinter

# Trigger mega-linter on every PR to main.
on:
  pull_request:
    branches:
      - main

permissions: {}

env:
  # Apply linter fixes configuration
  #
  # When active, APPLY_FIXES must also be defined as environment variable
  # (in github/workflows/mega-linter.yml or other CI tool)
  APPLY_FIXES: all

  # Decide which event triggers application of fixes in a commit or a PR
  # (pull_request, push, all)
  APPLY_FIXES_EVENT: pull_request

  # If APPLY_FIXES is used, defines if the fixes are directly committed (commit)
  # or posted in a PR (pull_request)
  APPLY_FIXES_MODE: commit

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    if: github.actor != 'megalinter-bot'

    # Give the default GITHUB_TOKEN write permission to commit and push, comment
    # issues & post new PR; remove the ones you do not need
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 30
    environment:
      name: dev

    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true # zizmor: ignore[artipacked] required so same-repo auto-fix pushes can reuse the job token
          # Full history on PRs helps diff-aware tools; shallow clone keeps push runs faster.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          ref: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.head_ref ||
              github.ref
            }}

      # Free up disk space before running MegaLinter
      - name: Cleanup Unused Docker Images and Containers
        run: |
          echo "=== Docker Images Before Cleanup ==="
          docker images

          echo ""
          echo "=== Cleaning Docker Images ==="
          docker image prune -af || true
          docker container prune -f || true

          echo ""
          echo "=== Docker Images After Cleanup ==="
          docker images

          echo ""
          echo "=== Disk Usage After Cleanup ==="
          df -h
          docker system df

      # MegaLinter
      - name: MegaLinter
        # More info at https://megalinter.io/flavors/
        uses: oxsecurity/megalinter@15e5b45552097e318c93de385779ce3b1084052c # v10.0.0

        id: ml

        # All available variables are described in documentation
        # https://megalinter.io/configuration/
        env:
          # Run full-repo lint on PRs; use changed-files mode on non-PR events.
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'pull_request' }} # Validates all source when its a PR, else just the git diff with main.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
          if-no-files-found: ignore

      # Set APPLY_FIXES_IF var for use in future steps
      - name: Set APPLY_FIXES_IF var
        if: always()
        run: |
          printf 'APPLY_FIXES_IF=%s\n' "${{
            steps.ml.outputs.has_updated_sources == 1 &&
            (
              env.APPLY_FIXES_EVENT == 'all' ||
              env.APPLY_FIXES_EVENT == github.event_name
            ) &&
            (
              github.event_name == 'push' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}" >> "${GITHUB_ENV}"

      # Set APPLY_FIXES_IF_* vars for use in future steps
      - name: Set APPLY_FIXES_IF_* vars
        if: always()
        run: |
          printf 'APPLY_FIXES_IF_PR=%s\n' "${{
            env.APPLY_FIXES_IF == 'true' &&
            env.APPLY_FIXES_MODE == 'pull_request'
          }}" >> "${GITHUB_ENV}"
          printf 'APPLY_FIXES_IF_COMMIT=%s\n' "${{
            env.APPLY_FIXES_IF == 'true' &&
            env.APPLY_FIXES_MODE == 'commit' &&
            (!contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref))
          }}" >> "${GITHUB_ENV}"

      # Create pull request if applicable
      # (for now works only on PR from same repository, not from forks)
      - name: Create Pull Request with applied fixes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        if: always() && env.APPLY_FIXES_IF_PR == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[MegaLinter] Apply linters automatic fixes"
          title: "[MegaLinter] Apply linters automatic fixes"
          labels: bot

      - name: Create PR output
        if: always() && steps.cpr.conclusion == 'success' && env.APPLY_FIXES_IF_PR == 'true'
        run: |
          echo "PR Number - ${STEPS_CPR_OUTPUTS_PULL_REQUEST_NUMBER}"
          echo "PR URL - ${STEPS_CPR_OUTPUTS_PULL_REQUEST_URL}"
        env:
          STEPS_CPR_OUTPUTS_PULL_REQUEST_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          STEPS_CPR_OUTPUTS_PULL_REQUEST_URL: ${{ steps.cpr.outputs.pull-request-url }}

      # Push new commit if applicable
      # (for now works only on PR from same repository, not from forks)
      - name: Prepare commit
        if: always() && env.APPLY_FIXES_IF_COMMIT == 'true'
        run: sudo chown -Rc $UID .git/

      - name: Skip markdown/json-only fix commit for bot branches
        if: always() && env.APPLY_FIXES_IF_COMMIT == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
        run: |
          # Avoid noisy auto-fix commits for bot branches that only touch docs/JSON.
          branch="${HEAD_REF}"

          case "$branch" in
            create-pull-request/patch|renovate/*)
              ;;
            *)
              exit 0
              ;;
          esac

          changed_files=$(
            {
              git diff --name-only --diff-filter=ACMR HEAD
              git ls-files --others --exclude-standard
            } | sort -u
          )

          if [ -z "$changed_files" ]; then
            exit 0
          fi

          if echo "$changed_files" | grep -viE '\.(md|json)$' > /dev/null; then
            exit 0
          fi

          echo 'APPLY_FIXES_IF_COMMIT=false' >> "${GITHUB_ENV}"

      - name: Commit and push applied linter fixes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        if: always() && env.APPLY_FIXES_IF_COMMIT == 'true'
        with:
          branch: >-
            ${{
              github.event.pull_request.head.ref ||
              github.head_ref ||
              github.ref
            }}
          commit_message: "[MegaLinter] Apply linters fixes"
          commit_user_name: megalinter-bot
          commit_user_email: 129584137+megalinter-bot@users.noreply.github.com
          file_pattern: ". :!.github/workflows/**"
