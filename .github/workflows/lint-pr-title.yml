---
name: "Lint PR Title"

permissions: read-all

# pull_request_target is used here intentionally: the action reads the PR title from
# the event payload and needs token write access to report a status check on fork PRs.
# No untrusted code is checked out or executed, so this is safe.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
